[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickets"
version = "0.1.0"
description = "Bootcamp exercises for validated data and LLM APIs"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.scripts]
chat = "chatbot.chat:main"

[project.optional-dependencies]
analysis = ["pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/tickets", "src/chatbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
