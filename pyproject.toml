[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickets"
version = "0.1.0"
description = "Validate AMC/service ticket CSV files"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[project.optional-dependencies]
analysis = ["pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/tickets"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
